<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Speedwoorms — touch prototype</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
    body { font-family: Arial, Helvetica, sans-serif; touch-action: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .top { position: fixed; z-index: 2; inset: max(12px, env(safe-area-inset-top)) 18px auto; display: flex; justify-content: space-between; align-items: start; pointer-events: none; }
    .brand { font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: .17em; color: #ff9fa8; text-transform: uppercase; }
    .sub { margin-top: 7px; color: #777; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .distance { color: #f5f2f4; font-size: 18px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .meter { margin-top: 7px; color: #777; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .hint { position: fixed; z-index: 2; left: 50%; bottom: max(17px, env(safe-area-inset-bottom)); width: min(590px, calc(100vw - 40px)); transform: translateX(-50%); color: #858185; font-size: 11px; line-height: 1.35; letter-spacing: .04em; text-align: center; transition: opacity .35s; pointer-events: none; }
    .hint strong { color: #ffb4b9; font-weight: 700; }
    button { position: fixed; z-index: 3; right: 15px; bottom: max(13px, env(safe-area-inset-bottom)); width: 35px; height: 35px; border: 1px solid #302b2e; border-radius: 50%; background: #0d0c0d; color: #aaa; font-size: 17px; line-height: 1; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Speedwoorms touch prototype"></canvas>
  <div class="top">
    <div><div class="brand">Speedwoorms</div><div class="sub" id="state">right, then left</div></div>
    <div><div class="distance"><span id="distance">0</span> m</div><div class="meter">opponent in outline</div></div>
  </div>
  <div class="hint" id="hint"><strong>Right thumb:</strong> stroke right to extend. <strong>Left thumb:</strong> stroke right to fold. Return left to reload each stroke.</div>
  <button id="reset" aria-label="Restart">↻</button>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const stateLabel = document.getElementById('state');
      const distanceLabel = document.getElementById('distance');
      const hint = document.getElementById('hint');
      let w = 0, h = 0, dpr = 1, last = performance.now();
      const fingers = new Map();
      // fold = 0 is the long, flat resting state. fold = 1 is the short, arched resting state.
      const worm = { fold: 1, targetFold: 1, scroll: 0, moved: false, lastStep: 0, expected: 'right', response: 14 };

      function lockLandscape() {
        const tg = window.Telegram?.WebApp;
        tg?.ready?.(); tg?.expand?.();
        if (tg?.isVersionAtLeast?.('8.0')) { tg.requestFullscreen?.(); tg.lockOrientation?.(); }
        else screen.orientation?.lock?.('landscape').catch(() => {});
      }
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2); w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', lockLandscape);
      resize();

      function addPointer(event) {
        event.preventDefault(); lockLandscape();
        const side = event.clientX < w / 2 ? 'left' : 'right';
        for (const finger of fingers.values()) if (finger.side === side) return;
        fingers.set(event.pointerId, { side, x: event.clientX, leftTravel: 0, armed: true });
        canvas.setPointerCapture?.(event.pointerId);
        hint.style.opacity = '0';
      }
      function takeStep(side, now) {
        if (fingers.size < 2) { stateLabel.textContent = 'use both thumbs'; return; }
        if (side !== worm.expected) {
          stateLabel.textContent = worm.expected === 'right' ? 'right thumb first' : 'now left thumb';
          return;
        }
        const interval = worm.lastStep ? now - worm.lastStep : 440;
        worm.lastStep = now;
        const cadence = Math.max(.65, Math.min(2.5, 440 / interval));
        worm.response = 11 + cadence * 7;
        worm.targetFold = side === 'right' ? 0 : 1;
        worm.expected = side === 'right' ? 'left' : 'right';
        worm.scroll += 14 * cadence;
        worm.moved = true;
        stateLabel.textContent = cadence > 1.6 ? 'fast crawl' : side === 'right' ? 'right — extend' : 'left — fold';
      }
      function movePointer(event) {
        const finger = fingers.get(event.pointerId); if (!finger) return;
        const dx = event.clientX - finger.x; finger.x = event.clientX;
        if (dx < 0) { finger.leftTravel = 0; finger.armed = true; return; }
        if (dx <= 0) return;
        finger.leftTravel += dx;
        if (finger.armed && finger.leftTravel >= 24) {
          finger.armed = false;
          takeStep(finger.side, performance.now());
        }
      }
      function removePointer(event) { fingers.delete(event.pointerId); }
      canvas.addEventListener('pointerdown', addPointer);
      canvas.addEventListener('pointermove', movePointer);
      canvas.addEventListener('pointerup', removePointer);
      canvas.addEventListener('pointercancel', removePointer);
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      document.getElementById('reset').addEventListener('click', () => {
        fingers.clear();
        Object.assign(worm, { fold: 1, targetFold: 1, scroll: 0, moved: false, lastStep: 0, expected: 'left', response: 14 });
        hint.style.opacity = '1'; stateLabel.textContent = 'left, then right';
      });

      // Central arch has fixed arclength. Its chord shortens while its height grows.
      function archGeometry(fold, bodyLength) {
        const legTotal = bodyLength * .29;
        const leftLeg = legTotal * .34;
        const rightLeg = legTotal - leftLeg;
        const arcLength = bodyLength - legTotal;
        const chord = arcLength * (1 - fold * .36);
        let low = 0, high = arcLength;
        const arcLengthFor = height => {
          let length = 0, px = 0, py = 0;
          for (let i = 1; i <= 40; i++) {
            const t = i / 40, x = chord * t, y = -height * Math.sin(Math.PI * t);
            length += Math.hypot(x - px, y - py); px = x; py = y;
          }
          return length;
        };
        for (let i = 0; i < 18; i++) {
          const mid = (low + high) / 2;
          if (arcLengthFor(mid) < arcLength) low = mid; else high = mid;
        }
        return { leftLeg, rightLeg, chord, height: (low + high) / 2 };
      }
      function wormPath(center, baseY, fold, bodyLength) {
        const { leftLeg, rightLeg, chord, height } = archGeometry(fold, bodyLength);
        const span = chord + leftLeg + rightLeg;
        const head = center - span / 2, leftArc = head + leftLeg, rightArc = leftArc + chord, tail = rightArc + rightLeg;
        ctx.beginPath(); ctx.moveTo(head, baseY); ctx.lineTo(leftArc, baseY);
        for (let i = 1; i <= 40; i++) {
          const t = i / 40;
          ctx.lineTo(leftArc + chord * t, baseY - height * Math.sin(Math.PI * t));
        }
        ctx.lineTo(tail, baseY);
      }
      function drawOutline(center, baseY, fold, bodyLength, width) {
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#d76e9f'; ctx.lineWidth = width;
        wormPath(center, baseY, fold, bodyLength); ctx.stroke();
        ctx.strokeStyle = '#050505'; ctx.lineWidth = width - 5;
        wormPath(center, baseY, fold, bodyLength); ctx.stroke();
        ctx.restore();
      }
      function update(dt) {
        worm.fold += (worm.targetFold - worm.fold) * Math.min(1, dt * worm.response);
        distanceLabel.textContent = Math.floor(worm.scroll / 12);
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const baseY = h * .69;
        ctx.save();
        ctx.strokeStyle = '#201b1e'; ctx.lineWidth = 1; ctx.setLineDash([3, 15]); ctx.lineDashOffset = -worm.scroll;
        ctx.beginPath(); ctx.moveTo(0, baseY + 48); ctx.lineTo(w, baseY + 48); ctx.stroke();
        ctx.restore();

        const bodyLength = Math.min(360, w * .5);
        const width = Math.max(21, Math.min(31, h * .06));
        const center = w * .5;
        // The rival is deliberately behind the player and is a contour only.
        drawOutline(center + 14, baseY + 38, .52, bodyLength, width);
        // The player's body has a fixed length and is completely solid.
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#ff9fa8'; ctx.lineWidth = width;
        wormPath(center, baseY, worm.fold, bodyLength); ctx.stroke(); ctx.restore();

        for (const finger of fingers.values()) {
          ctx.save(); ctx.globalAlpha = .42; ctx.strokeStyle = '#ffb4b9'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(finger.x, h * .5, 19, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        if (!worm.moved) {
          ctx.fillStyle = '#343034'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
          ctx.fillText('RIGHT  →     THEN     LEFT  →', center, baseY - 42);
        }
      }
      function loop(now) {
        const dt = Math.min(.05, (now - last) / 1000); last = now;
        update(dt); draw(); requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
