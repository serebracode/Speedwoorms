<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Speedwoorms — touch prototype</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
    body { font-family: Arial, Helvetica, sans-serif; touch-action: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .top { position: fixed; z-index: 2; inset: max(12px, env(safe-area-inset-top)) 18px auto; display: flex; justify-content: space-between; align-items: start; pointer-events: none; }
    .brand { font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: .17em; color: #ff9fa8; text-transform: uppercase; }
    .sub { margin-top: 7px; color: #777; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .hint { position: fixed; z-index: 2; left: 50%; bottom: max(17px, env(safe-area-inset-bottom)); width: min(590px, calc(100vw - 40px)); transform: translateX(-50%); color: #858185; font-size: 11px; line-height: 1.35; letter-spacing: .04em; text-align: center; transition: opacity .35s; pointer-events: none; }
    .hint strong { color: #ffb4b9; font-weight: 700; }
    button { position: fixed; z-index: 3; right: 15px; bottom: max(13px, env(safe-area-inset-bottom)); width: 35px; height: 35px; border: 1px solid #302b2e; border-radius: 50%; background: #0d0c0d; color: #aaa; font-size: 17px; line-height: 1; }
    .top.hidden, .hint.hidden, #reset.hidden { display: none; }
    .lobby { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 26px; background: #050505; color: #f3eef0; }
    .lobby-panel { width: min(100%, 700px); display: flex; flex-direction: column; align-items: center; }
    .brand-logo { position: static; width: auto; height: auto; margin: 0 0 58px; padding: 0; border: 0; border-radius: 0; background: none; color: #ffb2b8; font: 700 clamp(38px, 9vw, 92px)/1 ui-rounded, system-ui, sans-serif; letter-spacing: -.06em; white-space: nowrap; cursor: pointer; }
    .invite-button { position: static; width: min(82vw, 625px); height: clamp(72px, 14vh, 138px); margin: 0; border: 0; border-radius: 999px; background: #303030; color: #ffb2b8; font: 500 clamp(27px, 5.2vw, 58px)/1 ui-rounded, system-ui, sans-serif; letter-spacing: -.035em; }
    .invite-status { min-height: 20px; margin: 23px 0 0; color: #999; font: 600 13px/1.4 ui-rounded, system-ui, sans-serif; text-align: center; }
    .start-indicator { display: none; align-items: center; gap: 9px; margin-top: 22px; color: #aaa; font: 600 12px/1.2 ui-rounded, system-ui, sans-serif; letter-spacing: .03em; }
    .start-indicator.show { display: flex; }
    .start-indicator::before { content: ''; width: 8px; height: 8px; border: 1px solid #ffb2b8; border-radius: 50%; box-shadow: 0 0 9px #ff9fa866; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Speedwoorms touch prototype"></canvas>
  <main class="lobby" id="lobby">
    <section class="lobby-panel" id="lobbyPanel">
      <button class="brand-logo" id="testModeButton" aria-label="Start two-worm test mode">Speed Worms</button>
      <button class="invite-button" id="inviteButton">Invite a Worm</button>
      <div class="invite-status" id="inviteStatus" aria-live="polite"></div>
      <div class="start-indicator" id="startIndicator">Waiting for invited worm at the start line</div>
    </section>
  </main>
  <div class="top hidden" id="gameHud">
    <div><div class="brand">Speedwoorms</div><div class="sub" id="state">right, then left</div></div>
  </div>
  <div class="hint hidden" id="hint"><strong>Right thumb:</strong> stroke right, release. <strong>Left thumb:</strong> stroke right, release. Alternate.</div>
  <button id="reset" class="hidden" aria-label="Restart">↻</button>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const stateLabel = document.getElementById('state');
      const hint = document.getElementById('hint');
      const lobby = document.getElementById('lobby');
      const gameHud = document.getElementById('gameHud');
      const resetButton = document.getElementById('reset');
      let w = 0, h = 0, dpr = 1, last = performance.now();
      let backgroundDots = [];
      const fingers = new Map();
      // Seven traced centre-lines from the supplied 852 x 393 frames.
      // The complete landscape game is rotated once into the portrait viewport.
      const DESIGN_W = 852;
      const DESIGN_H = 393;
      const STEP_ADVANCE = 229;
      const TEST_MODE = true;
      // After the straight pose, retrace frames 2 → 0 while the background advances.
      const wormFrames = [
        [[104,314],[209,314],[209,167],[280,167],[280,314],[512,314]],
        [[104,314],[219,314],[219,217],[295,265.5],[371,314],[572,314]],
        [[104,314],[219,314],[219,277],[304,295.5],[389,314],[622,314]],
        [[104,314],[219,314],[219,314],[621,314],[621,314],[741,314]],
        [[273,314],[388,314],[388,277],[473,295.5],[558,314],[791,314]],
        [[188,314],[303,314],[303,217],[379,265.5],[455,314],[656,314]],
        [[357,314],[462,314],[462,167],[533,167],[533,314],[765,314]]
      ];
      const worm = { phase: 0, targetPhase: 0, cycle: 0, scroll: 0, moved: false, lastStep: 0, expected: 'right', response: 14, color: '#ffb7b7', finished: false };
      const opponent = { phase: 0, targetPhase: 3, cycle: 0, pause: 0, color: '#343234' };
      let raceRunning = false;
      const inviteParams = new URLSearchParams(location.search);
      const incomingRoomCode = inviteParams.get('r') || inviteParams.get('room');
      let roomCode = incomingRoomCode || sessionStorage.getItem('speedwoorms-room') || Math.random().toString(36).slice(2, 10).toUpperCase();
      if (!incomingRoomCode) sessionStorage.setItem('speedwoorms-room', roomCode);

      const telegram = window.Telegram?.WebApp;
      function telegramCall(method) {
        try { telegram?.[method]?.(); } catch (_) { /* unavailable outside a supported Mini App client */ }
      }
      telegramCall('ready');
      telegramCall('expand');
      telegramCall('requestFullscreen');
      telegramCall('disableVerticalSwipes');
      if (matchMedia('(orientation: portrait)').matches) telegramCall('lockOrientation');

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2); w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Scatter equal white points sparsely across the whole landscape view.
        backgroundDots = Array.from({ length: 18 }, (_, order) => {
          const x = Math.random() * DESIGN_W;
          return { x, anchorX: x, y: Math.random() * DESIGN_H, radius: 1.2, order, segments: [], current: null };
        }).sort((a, b) => b.x - a.x).map((dot, order) => ({ ...dot, order }));
      }
      window.addEventListener('resize', resize);
      resize();

      function addPointer(event) {
        event.preventDefault();
        // The logical landscape x-axis maps to the portrait viewport y-axis.
        const side = event.clientY < h / 2 ? 'left' : 'right';
        for (const finger of fingers.values()) if (finger.side === side) return;
        fingers.set(event.pointerId, { side, x: event.clientY, leftTravel: 0, armed: true });
        canvas.setPointerCapture?.(event.pointerId);
        hint.style.opacity = '0';
      }
      function takeStep(side, now) {
        if (worm.finished || (worm.targetPhase === 6 && worm.phase < 5.98)) return;
        if (fingers.size > 1) { stateLabel.textContent = 'release before the next stroke'; return; }
        if (side !== worm.expected) {
          stateLabel.textContent = worm.expected === 'right' ? 'right thumb first' : 'now left thumb';
          return;
        }
        const interval = worm.lastStep ? now - worm.lastStep : 440;
        worm.lastStep = now;
        const cadence = Math.max(.65, Math.min(2.5, 440 / interval));
        worm.response = 11 + cadence * 7;
        worm.targetPhase = side === 'right' ? 3 : 6;
        worm.expected = side === 'right' ? 'left' : 'right';
        worm.moved = true;
        stateLabel.textContent = cadence > 1.6 ? 'fast crawl' : side === 'right' ? 'right — extend' : 'left — fold';
      }
      function movePointer(event) {
        const finger = fingers.get(event.pointerId); if (!finger) return;
        const dx = event.clientY - finger.x; finger.x = event.clientY;
        if (dx < 0) { finger.leftTravel = 0; finger.armed = true; return; }
        if (dx <= 0) return;
        finger.leftTravel += dx;
        if (finger.armed && finger.leftTravel >= 24) {
          finger.armed = false;
          takeStep(finger.side, performance.now());
        }
      }
      function removePointer(event) { fingers.delete(event.pointerId); }
      canvas.addEventListener('pointerdown', addPointer);
      canvas.addEventListener('pointermove', movePointer);
      canvas.addEventListener('pointerup', removePointer);
      canvas.addEventListener('pointercancel', removePointer);
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      resetButton.addEventListener('click', () => {
        fingers.clear();
        resetBackgroundDots();
        Object.assign(worm, { phase: 0, targetPhase: 0, cycle: 0, scroll: 0, moved: false, lastStep: 0, expected: 'right', response: 14, finished: false });
        Object.assign(opponent, { phase: 0, targetPhase: 3, cycle: 0, pause: 0 });
        hint.style.opacity = '1'; stateLabel.textContent = 'right, then left';
      });

      function wrappedAnchor(frameIndex, anchorIndex) {
        const frameCount = wormFrames.length;
        const normalizedIndex = ((frameIndex % frameCount) + frameCount) % frameCount;
        const source = wormFrames[normalizedIndex][anchorIndex];
        return [source[0], source[1]];
      }
      function catmull(p0, p1, p2, p3, t) {
        const t2 = t * t, t3 = t2 * t;
        return .5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
      }
      function currentWormFrame(phase, cycle = worm.cycle) {
        const index = Math.floor(phase);
        const t = Math.max(0, Math.min(1, phase - index));
        return wormFrames[0].map((_, anchorIndex) => {
          const p0 = wrappedAnchor(index - 1 + cycle * 7, anchorIndex);
          const p1 = wrappedAnchor(index + cycle * 7, anchorIndex);
          const p2 = wrappedAnchor(index + 1 + cycle * 7, anchorIndex);
          const p3 = wrappedAnchor(index + 2 + cycle * 7, anchorIndex);
          // The pull is already distributed across the build keys (3 → 6).
          // Keep the folded body still in 6 → 7. Catmull-Rom otherwise moves
          // F slightly even though its frame-6 and next-frame positions match,
          // making the tail (F-E) twitch before the cycle wraps.
          if (index === 6 && anchorIndex <= 4) {
            return [p1[0] + (p2[0] - p1[0]) * t, p1[1] + (p2[1] - p1[1]) * t];
          }
          return [catmull(p0[0], p1[0], p2[0], p3[0], t), catmull(p0[1], p1[1], p2[1], p3[1], t)];
        });
      }
      function drawBackground() {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#fff';
        ctx.globalAlpha = 1;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        for (const dot of backgroundDots) {
          const visibleSegments = dot.segments.filter(segment => segment.right - segment.left > .5);
          if (!visibleSegments.length) {
            ctx.beginPath();
            ctx.arc(dot.anchorX, dot.y, dot.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          for (const segment of visibleSegments) {
            ctx.beginPath();
            ctx.moveTo(segment.left, dot.y);
            ctx.lineTo(segment.right, dot.y);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }
      function resetBackgroundDots() {
        for (const dot of backgroundDots) {
          dot.anchorX = dot.x;
          dot.current = null;
          dot.segments.length = 0;
        }
      }
      function updateBackgroundMotion(dt, phaseSpeed) {
        const headX = currentWormFrame(worm.phase)[5][0];
        const headTravel = Math.max(0, Math.min(STEP_ADVANCE, headX - wormFrames[0][5][0]));
        const recoverySpeed = (STEP_ADVANCE / 3) * phaseSpeed * .58;
        const recoveryWave = (3 / phaseSpeed) * .28;
        for (const dot of backgroundDots) {
          if (worm.phase < 3) {
            if (dot.current && !dot.current.growing) dot.current = null;
            const delay = dot.order / Math.max(1, backgroundDots.length - 1) * STEP_ADVANCE * .38;
            if (!dot.current && headTravel > delay) {
              dot.current = { left: dot.anchorX, right: dot.anchorX, growing: true, wait: 0 };
              dot.segments.push(dot.current);
            }
            if (dot.current?.growing) {
              const extension = Math.max(0, headTravel - delay);
              dot.current.left = dot.anchorX - extension;
              dot.current.right = dot.anchorX;
            }
          } else if (dot.current?.growing) {
            // The leftmost endpoint survives as the next burst's origin.
            dot.current.growing = false;
            dot.anchorX = dot.current.left;
            dot.current.wait = dot.order / Math.max(1, backgroundDots.length - 1) * recoveryWave;
          }

          for (const segment of dot.segments) {
            if (segment.growing) continue;
            if (segment.wait > 0) segment.wait = Math.max(0, segment.wait - dt);
            else segment.right = Math.max(segment.left, segment.right - recoverySpeed * dt);
          }
          dot.segments = dot.segments.filter(segment => segment.right - segment.left > .5);
          if (dot.current && !dot.segments.includes(dot.current)) dot.current = null;
          if (!dot.segments.length && dot.anchorX < 0) {
            const band = DESIGN_W;
            dot.anchorX = ((dot.anchorX % band) + band) % band;
          }
        }
      }
      function roundedPath(points, radius) {
        const clean = points.filter((point, index) => !index || Math.hypot(point[0] - points[index - 1][0], point[1] - points[index - 1][1]) > .01);
        ctx.beginPath();
        ctx.moveTo(clean[0][0], clean[0][1]);
        for (let i = 1; i < clean.length - 1; i++) {
          const previous = clean[i - 1], corner = clean[i], next = clean[i + 1];
          const beforeLength = Math.hypot(corner[0] - previous[0], corner[1] - previous[1]);
          const afterLength = Math.hypot(next[0] - corner[0], next[1] - corner[1]);
          const r = Math.min(radius, beforeLength / 2, afterLength / 2);
          const before = [corner[0] + (previous[0] - corner[0]) * r / beforeLength, corner[1] + (previous[1] - corner[1]) * r / beforeLength];
          const after = [corner[0] + (next[0] - corner[0]) * r / afterLength, corner[1] + (next[1] - corner[1]) * r / afterLength];
          ctx.lineTo(before[0], before[1]);
          ctx.quadraticCurveTo(corner[0], corner[1], after[0], after[1]);
        }
        const last = clean[clean.length - 1];
        ctx.lineTo(last[0], last[1]);
      }
      function drawWormFrame(points, colour, lineWidth = 63.14) {
        ctx.save();
        ctx.strokeStyle = colour;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        // One full body-width radius, clamped by neighbouring anchor spacing,
        // rounds the fold without letting adjacent corner arcs cross.
        roundedPath(points, lineWidth);
        ctx.stroke();
        ctx.restore();
      }
      document.getElementById('inviteButton').addEventListener('click', async () => {
        const inviteUrl = new URL(location.href);
        inviteUrl.search = '';
        inviteUrl.hash = '';
        inviteUrl.searchParams.set('r', roomCode);
        const message = 'Join my Speed Worms race';
        try {
          if (telegram?.openTelegramLink) {
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(inviteUrl.href)}&text=${encodeURIComponent(message)}`;
            telegram.openTelegramLink(shareUrl);
          } else if (navigator.share) {
            await navigator.share({ title: 'Speedwoorms', text: message, url: inviteUrl.href });
          } else if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(`${message}\n${inviteUrl.href}`);
            document.getElementById('inviteStatus').textContent = 'Invite link copied. Send it to a contact.';
          } else {
            document.getElementById('inviteStatus').textContent = `Room ${roomCode} · ${inviteUrl.href}`;
          }
        } catch (error) {
          if (error.name !== 'AbortError') document.getElementById('inviteStatus').textContent = 'Could not open sharing. Copy the room link from the address bar.';
        }
      });
      document.getElementById('testModeButton').addEventListener('click', startTestMode);

      function startTestMode() {
        lobby.style.display = 'none';
        fingers.clear();
        resetBackgroundDots();
        Object.assign(worm, { phase: 0, targetPhase: 0, cycle: 0, scroll: 0, moved: false, lastStep: 0, expected: 'right', response: 14, finished: false });
        Object.assign(opponent, { phase: 0, targetPhase: 3, cycle: 0, pause: .45 });
        raceRunning = true;
        gameHud.classList.remove('hidden');
        hint.classList.remove('hidden');
        resetButton.classList.remove('hidden');
      }

      function racePosition(racer) {
        const head = currentWormFrame(racer.phase, racer.cycle)[5][0];
        const cycleAdvance = wormFrames[6][5][0] - wormFrames[0][5][0];
        return racer.cycle * cycleAdvance + head - wormFrames[0][5][0];
      }
      function updateOpponent(dt, playerPhaseSpeed) {
        if (!raceRunning || !TEST_MODE) return;
        if (opponent.pause > 0) { opponent.pause = Math.max(0, opponent.pause - dt); return; }
        const delta = opponent.targetPhase - opponent.phase;
        const speed = playerPhaseSpeed * .82;
        opponent.phase += Math.sign(delta) * Math.min(Math.abs(delta), dt * speed);
        if (opponent.phase >= opponent.targetPhase) {
          if (opponent.targetPhase === 3) {
            opponent.targetPhase = 6;
          } else {
            opponent.cycle += 1;
            opponent.phase = 0;
            opponent.targetPhase = 3;
            opponent.pause = .18;
          }
        }
      }
      function update(dt) {
        const delta = worm.targetPhase - worm.phase;
        const phaseSpeed = 5 + (worm.response - 11) * .58;
        const phaseStep = Math.min(Math.abs(delta), dt * phaseSpeed);
        worm.phase += Math.sign(delta) * phaseStep;
        updateBackgroundMotion(dt, phaseSpeed);
        updateOpponent(dt, phaseSpeed);
        if (worm.targetPhase === 6 && worm.phase >= 6) {
          worm.cycle += 1;
          worm.phase = 0;
          worm.targetPhase = 0;
        }
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const scale = Math.min(w / DESIGN_H, h / DESIGN_W);
        const sceneX = (w - DESIGN_H * scale) / 2;
        const sceneY = (h - DESIGN_W * scale) / 2;
        ctx.save();
        ctx.translate(sceneX + DESIGN_H * scale, sceneY);
        ctx.rotate(Math.PI / 2);
        ctx.scale(scale, scale);
        drawBackground();
        const points = currentWormFrame(worm.phase);
        const bodyCenter = (points[0][0] + points[5][0]) / 2;
        const leftOfCenter = DESIGN_W * .46;
        const placement = leftOfCenter - bodyCenter;
        if (TEST_MODE && raceRunning) {
          const opponentPoints = currentWormFrame(opponent.phase, opponent.cycle);
          const headDelta = racePosition(opponent) - racePosition(worm);
          const opponentPlacement = points[5][0] + placement + headDelta - opponentPoints[5][0];
          drawWormFrame(opponentPoints.map(([x, y]) => [x + opponentPlacement, y]), opponent.color);
        }
        drawWormFrame(points.map(([x, y]) => [x + placement, y]), worm.color);
        ctx.restore();
      }
      function loop(now) {
        const dt = Math.min(.05, (now - last) / 1000); last = now;
        update(dt); draw(); requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
