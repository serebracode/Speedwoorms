<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Speedwoorms — touch prototype</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
    body { font-family: Arial, Helvetica, sans-serif; touch-action: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .top { position: fixed; z-index: 2; inset: max(12px, env(safe-area-inset-top)) 18px auto; display: flex; justify-content: space-between; align-items: start; pointer-events: none; }
    .brand { font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: .17em; color: #ff9fa8; text-transform: uppercase; }
    .sub { margin-top: 7px; color: #777; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .distance { color: #f5f2f4; font-size: 18px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .meter { margin-top: 7px; color: #777; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .hint { position: fixed; z-index: 2; left: 50%; bottom: max(17px, env(safe-area-inset-bottom)); width: min(580px, calc(100vw - 40px)); transform: translateX(-50%); color: #858185; font-size: 11px; line-height: 1.35; letter-spacing: .04em; text-align: center; transition: opacity .35s; pointer-events: none; }
    .hint strong { color: #ffb4b9; font-weight: 700; }
    button { position: fixed; z-index: 3; right: 15px; bottom: max(13px, env(safe-area-inset-bottom)); width: 35px; height: 35px; border: 1px solid #302b2e; border-radius: 50%; background: #0d0c0d; color: #aaa; font-size: 17px; line-height: 1; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Speedwoorms touch prototype"></canvas>
  <div class="top">
    <div><div class="brand">Speedwoorms</div><div class="sub" id="state">front, then rear</div></div>
    <div><div class="distance"><span id="distance">0</span> m</div><div class="meter">opponent in outline</div></div>
  </div>
  <div class="hint" id="hint"><strong>Left thumb:</strong> move the front left. <strong>Right thumb:</strong> pull the rear after it.</div>
  <button id="reset" aria-label="Restart">↻</button>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const stateLabel = document.getElementById('state');
      const distanceLabel = document.getElementById('distance');
      const hint = document.getElementById('hint');
      let w = 0, h = 0, dpr = 1, last = performance.now(), camera = 0;
      const fingers = new Map();
      // World coordinates: progress is to the left, therefore lower x means forward.
      const worm = { front: 0, rear: 300, speed: 0, progress: 0, moved: false, phase: 'front', rearMoved: false };
      function lockLandscape() {
        const tg = window.Telegram?.WebApp;
        tg?.ready?.(); tg?.expand?.();
        if (tg?.isVersionAtLeast?.('8.0')) { tg.requestFullscreen?.(); tg.lockOrientation?.(); }
        else screen.orientation?.lock?.('landscape').catch(() => {});
      }
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2); w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize); window.addEventListener('orientationchange', lockLandscape); resize();

      function addPointer(event) {
        event.preventDefault(); lockLandscape();
        const side = event.clientX < w / 2 ? 'front' : 'rear';
        for (const finger of fingers.values()) if (finger.side === side) return;
        fingers.set(event.pointerId, { side, x: event.clientX });
        canvas.setPointerCapture?.(event.pointerId);
        hint.style.opacity = '0';
      }
      function movePointer(event) {
        const finger = fingers.get(event.pointerId); if (!finger) return;
        const dx = event.clientX - finger.x; finger.x = event.clientX;
        if (dx >= 0) return; // Racing only advances left in this first prototype.
        if (finger.side === 'front') {
          if (worm.phase !== 'front') { stateLabel.textContent = 'rear must follow first'; return; }
          const next = Math.max(worm.rear - 465, worm.front + dx);
          const moved = next - worm.front;
          worm.front = next;
          if (moved < 0) { worm.phase = 'rear'; worm.rearMoved = false; worm.moved = true; stateLabel.textContent = 'front forward — now pull rear'; }
        } else {
          if (worm.phase !== 'rear') { stateLabel.textContent = 'front goes first'; return; }
          const next = Math.max(worm.front + 75, worm.rear + dx);
          const moved = next - worm.rear;
          worm.rear = next;
          if (moved < 0) { worm.rearMoved = true; worm.moved = true; stateLabel.textContent = 'rear follows — fold'; }
        }
      }
      function removePointer(event) {
        const finger = fingers.get(event.pointerId);
        if (finger?.side === 'rear' && worm.rearMoved) { worm.phase = 'front'; worm.rearMoved = false; stateLabel.textContent = 'front forward — stretch'; }
        fingers.delete(event.pointerId);
      }
      canvas.addEventListener('pointerdown', addPointer);
      canvas.addEventListener('pointermove', movePointer);
      canvas.addEventListener('pointerup', removePointer);
      canvas.addEventListener('pointercancel', removePointer);
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      document.getElementById('reset').addEventListener('click', () => {
        fingers.clear(); Object.assign(worm, { front: 0, rear: 300, speed: 0, progress: 0, moved: false, phase: 'front', rearMoved: false }); camera = 0; hint.style.opacity = '1'; stateLabel.textContent = 'front, then rear';
      });

      function archPath(tailX, headX, baseY, archWidth, archHeight) {
        const centre = (tailX + headX) / 2, left = centre - archWidth / 2, right = centre + archWidth / 2;
        ctx.beginPath(); ctx.moveTo(headX, baseY); ctx.lineTo(left, baseY);
        ctx.bezierCurveTo(left + archWidth * .02, baseY - archHeight, right - archWidth * .02, baseY - archHeight, right, baseY);
        ctx.lineTo(tailX, baseY);
      }
      function drawOutline(tailX, headX, baseY, archWidth, archHeight, width) {
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#d76e9f'; ctx.lineWidth = width; archPath(tailX, headX, baseY, archWidth, archHeight); ctx.stroke();
        ctx.strokeStyle = '#050505'; ctx.lineWidth = width - 5; archPath(tailX, headX, baseY, archWidth, archHeight); ctx.stroke();
        ctx.restore();
      }
      function update(dt) {
        const centre = (worm.front + worm.rear) / 2;
        camera += (centre - camera) * Math.min(1, dt * 5);
        worm.progress = Math.max(worm.progress, -centre);
        distanceLabel.textContent = Math.floor(worm.progress / 11);
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const baseY = h * .69;
        ctx.save(); ctx.strokeStyle = '#181517'; ctx.lineWidth = 1; ctx.setLineDash([2, 12]); ctx.lineDashOffset = worm.progress * .9;
        ctx.beginPath(); ctx.moveTo(0, baseY + 46); ctx.lineTo(w, baseY + 46); ctx.stroke(); ctx.restore();

        const headX = w * .49 + worm.front - camera;
        const tailX = w * .49 + worm.rear - camera;
        const separation = worm.rear - worm.front;
        const fold = Math.max(0, Math.min(1, (300 - separation) / 205));
        const archHeight = 8 + fold * Math.min(165, h * .34);
        const archWidth = Math.max(62, Math.min(separation * .56, 90 + fold * 105));
        const thickness = Math.max(21, Math.min(31, h * .06));

        // Rival stays behind and is only a hollow contour.
        drawOutline(tailX + 132, headX + 132, baseY + 42, archWidth * .84, Math.max(8, archHeight * .68), thickness);

        // Player is a fully solid, unbroken pink body.
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = '#ff708a'; ctx.shadowBlur = 11 + fold * 13;
        ctx.strokeStyle = '#ff9fa8'; ctx.lineWidth = thickness;
        archPath(tailX, headX, baseY, archWidth, archHeight); ctx.stroke(); ctx.restore();

        for (const finger of fingers.values()) {
          ctx.save(); ctx.globalAlpha = .42; ctx.strokeStyle = '#ffb4b9'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(finger.x, h * .5, 19, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        if (!worm.moved) {
          ctx.fillStyle = '#343034'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
          ctx.fillText('FRONT  ←                         REAR', w * .5, baseY - 40);
        }
      }
      function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
